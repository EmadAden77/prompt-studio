name: Phase 31 Audit Patch Runner

on:
  push:
    branches: [phase-31/full-audit-deconflict]
    paths:
      - '.github/workflows/remove-car-seat-feature.yml'

permissions:
  contents: write

jobs:
  phase31-final-source-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final stale Range Rover wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/data-base-phase16.js')
          s = p.read_text()
          s = s.replace('beige perforated leather and dark wood trim', 'Ivory perforated leather and dark wood veneer')
          p.write_text(s)
          # Scope the audit to Range Rover environment/template contracts, not clothing color names.
          checks = []
          for line in s.splitlines():
              if 'rangeRover:' in line or 'Range Rover Sport' in line or 'رنج روفر' in line:
                  checks.append(line)
          stale = [line for line in checks if '2022' in line or 'beige perforated leather' in line.lower()]
          if stale:
              raise SystemExit('stale Range Rover contract wording remains: ' + '\n'.join(stale))
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data-base-phase16.js
          if ! git diff --cached --quiet; then
            git commit -m 'Phase 31: full audit de-conflict pass'
            git push origin HEAD:phase-31/full-audit-deconflict
          fi
