name: Phase 31 Budget Patch Runner

on:
  push:
    branches: [phase-31/full-audit-deconflict]
    paths:
      - '.github/workflows/remove-car-seat-feature.yml'

permissions:
  contents: write

jobs:
  phase31-glass-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compact duplicated glass contract without losing semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_spec = '2017 Range Rover Sport Autobiography Dynamic L494 in Fuji White, gloss black grille and side-vent surrounds, 22-inch dark alloy wheels, quad rectangular exhaust tips, LED headlights with DRL signature, panoramic glass roof, transparent glass, never opaque black, carrying natural reflections and faint glimpses of the Ivory interior, small Autobiography Dynamic badging and Saudi plate present, both soft-focus and never legible.'
          new_spec = '2017 Range Rover Sport Autobiography Dynamic L494, Fuji White, gloss black grille and vent surrounds, 22-inch dark alloys, quad rectangular exhaust tips, LED DRLs, panoramic glass roof, transparent glass with natural reflections and a faint Ivory-cabin view, never opaque black; Autobiography Dynamic badging and Saudi plate, never legible.'

          for file in ['js/data.js', 'js/canonical/openai-image-adapter-phase23.js']:
              p = Path(file)
              s = p.read_text()
              if old_spec not in s:
                  raise SystemExit(f'missing exterior spec in {file}')
              p.write_text(s.replace(old_spec, new_spec))

          p = Path('js/canonical/openai-image-adapter.js')
          s = p.read_text()
          s = s.replace('At night the glass shows reflected streetlights and a dim view into the cabin instead of black panels; it remains transparent, never opaque black.', 'At night, transparent glass carries streetlight reflections and a dim cabin view; never opaque black.')
          s = s.replace('The windshield and side windows are clear glass with a light factory tint, carrying sky and environment reflections; the Ivory headliner and seats are faintly visible through the side glass; glass is never solid black.', 'Transparent windshield and side glass carry natural reflections and a faint view of the Ivory cabin; never opaque black.')
          s = s.replace('const contact = "Tires have realistic contact shadow; tinted glass carries natural environment reflection.";', 'const contact = "Tires have realistic contact shadow.";')
          s = s.replace('.replace(/Tires have realistic contact shadow; tinted glass carries natural environment reflection\\./iu, "Tires have realistic contact shadow.")', '.replace(/Tires have realistic contact shadow\\./iu, "Tires have realistic contact shadow.")')
          p.write_text(s)

          p = Path('tests/canonical-v3-glass-realism-phase27.mjs')
          s = p.read_text()
          s = s.replace('assert.match(CAR_EXTERIOR_SPEC, /lightly tinted TRANSPARENT glass, never opaque black/iu);', 'assert.match(CAR_EXTERIOR_SPEC, /transparent glass with natural reflections/iu);\nassert.match(CAR_EXTERIOR_SPEC, /never opaque black/iu);')
          s = s.replace('assert.match(CAR_EXTERIOR_SPEC, /natural reflections and faint glimpses of the Ivory interior/iu);', 'assert.match(CAR_EXTERIOR_SPEC, /faint Ivory-cabin view/iu);')
          s = s.replace('assert.match(describeGlassRealism(dayExterior), /clear glass with a light factory tint/iu);', 'assert.match(describeGlassRealism(dayExterior), /Transparent windshield and side glass/iu);')
          s = s.replace('assert.match(describeGlassRealism(dayExterior), /Ivory headliner and seats are faintly visible/iu);', 'assert.match(describeGlassRealism(dayExterior), /faint view of the Ivory cabin/iu);')
          s = s.replace('assert.match(describeGlassRealism(nightExterior), /dim view into the cabin instead of black panels/iu);', 'assert.match(describeGlassRealism(nightExterior), /dim cabin view/iu);')
          p.write_text(s)
          PY
      - name: Commit compact glass contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js js/canonical/openai-image-adapter-phase23.js js/canonical/openai-image-adapter.js tests/canonical-v3-glass-realism-phase27.mjs
          git commit -m 'Phase 31: full audit de-conflict pass'
          git push origin HEAD:phase-31/full-audit-deconflict
