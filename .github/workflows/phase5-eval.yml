name: Phase 5 comparison evaluation

on:
  push:
    branches: [phase5-comparison-eval]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run canonical V3 old-vs-new comparison
        run: node tests/canonical-v3-comparison.mjs
