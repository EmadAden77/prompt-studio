name: WikiPrompt Selfie Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: wikiprompt-selfie-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live deployment contract
        run: node tests/v2-deployment.mjs
      - name: Run WikiPrompt selfie engine tests
        run: node tests/physics-v5-wikiprompt.mjs
      - name: Run custom scene realism tests
        run: node tests/custom-scene.mjs
      - name: Run clothing material physics tests
        run: node tests/clothing-physics.mjs
      - name: Run Realism Core tests
        run: node tests/realism-core.mjs
      - name: Run Advanced Realism tests
        run: node tests/advanced-realism.mjs
      - name: Run AUTO REALISM suite tests
        run: node tests/auto-realism-suite.mjs
      - name: Run Visual Selfie Angle Monitor tests
        run: node tests/visual-selfie-angle-monitor.mjs
      - name: Run Canonical V3 OpenAI adapter isolation test
        run: node tests/canonical-v3-adapter-isolation.mjs
      - name: Run Canonical V3 natural imperfection layer test
        run: node tests/canonical-v3-realism-layer.mjs
      - name: Run Canonical V3 lighting physics layer test
        run: node tests/canonical-v3-lighting-physics-layer.mjs
      - name: Run Canonical V3 camera artifacts layer test
        run: node tests/canonical-v3-camera-artifacts-layer.mjs
      - name: Run Canonical V3 environmental details layer test
        run: node tests/canonical-v3-environmental-details-layer.mjs
      - name: Run Canonical V3 post-processing layer test
        run: node tests/canonical-v3-post-processing-layer.mjs
      - name: Run Canonical V3 vehicle view projection test
        run: node tests/canonical-v3-view-projection.mjs
      - name: Run Canonical V3 Range Rover interior specs test
        run: node tests/canonical-v3-range-rover-specs.mjs
      - name: Run Canonical V3 old-vs-new comparison
        run: node tests/canonical-v3-comparison.mjs
      - name: Run Canonical V3 feature flag gate
        run: node tests/canonical-v3-feature-flag.mjs
      - name: Run Phase 13 group selfie diversity tests
        run: node tests/canonical-v3-group-phase13.mjs
      - name: Run Phase 17 place realism tests
        run: node tests/canonical-v3-place-realism.mjs
      - name: Run Phase 18 micro-realism tests
        run: node tests/canonical-v3-micro-realism.mjs
      - name: Run Phase 19 indoor daily-scene tests
        run: node tests/canonical-v3-indoor-daily-scenes.mjs
      - name: Run Phase 20 outdoor daily-scene tests
        run: node tests/canonical-v3-outdoor-daily-scenes.mjs
      - name: Run Phase 21 exterior car realism tests
        run: node tests/canonical-v3-car-exterior.mjs
      - name: Run Phase 23 unified clothing panel tests
        run: node tests/canonical-v3-clothing-panel-phase23.mjs
      - name: Run Phase 24 gym anti-AI realism tests
        run: node tests/canonical-v3-gym-realism-phase24.mjs
      - name: Run Phase 25 youthful red shemagh + iqal headwear tests
        run: node tests/canonical-v3-headwear-phase25.mjs
      - name: Run Phase 26 body anatomy authority tests
        run: node tests/canonical-v3-body-anatomy-phase26.mjs
