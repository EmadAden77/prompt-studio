name: Physics v5 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: physics-v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run active deployment contract
        run: node tests/v2-deployment.mjs
      - name: Run Physics v5 and WikiPrompt integration tests
        run: node tests/physics-v5-wikiprompt.mjs
