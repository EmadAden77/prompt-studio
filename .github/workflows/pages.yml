name: Deploy Prompt Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Apply browser enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="copy-fix.js"></script>\n',
              '<script src="prompt-enhancements.js"></script>\n',
              '<script src="field-history.js"></script>\n',
              '<script src="face-expression-lock.js"></script>\n',
              '<script src="pose-lighting-options.js"></script>\n',
              '<script src="room-lock.js"></script>\n',
              '<script src="bedroom-controls.js"></script>\n',
              '<script src="auto-neutral-options.js"></script>\n',
              '<script src="selfie-body-controls.js"></script>\n',
              '<script src="conflict-guard.js"></script>\n',
              '<script src="scene-pages.js"></script>\n',
              '<script src="smart-workflow.js"></script>\n',
              '<script src="selfie-arm-auto.js"></script>\n',
              '<script src="version-fix.js"></script>\n',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
