name: Apply Master Realism Policy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-policy:
    if: contains(github.event.head_commit.message, '[apply-master-realism-policy]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate MASTER REALISM POLICY
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          auto = Path('js/auto-realism-suite-v1.js')
          s = auto.read_text(encoding='utf-8')

          marker = 'function buildReferenceAuthorityMap(state) {'
          if '[MASTER REALISM POLICY]' not in s:
              policy = '''function buildMasterRealismPolicy() {
            return `[MASTER REALISM POLICY]
          PHOTOGRAPHIC REALISM HAS PRIORITY OVER VISUAL PERFECTION.

          Every generated scene must represent one physically possible moment captured by a real camera operated from a physically possible position.

          Do not improve realism by exaggerating pores, sharpness, HDR, contrast, bokeh, skin texture, facial symmetry, hair detail or cinematic lighting.

          Realism must come from identity preservation, camera geometry, human anatomy, gravity, physical contact, material behavior, environment continuity, practical lighting, smartphone sensor limitations, ordinary image processing, natural imperfection and contextually believable human behavior.

          CONFLICT RESOLUTION: If a requested detail conflicts with physical plausibility, preserve the user's intended scene and automatically correct only the physically impossible component.

          PRIORITY ORDER:
          1. Reference identity
          2. Explicit user instructions
          3. Capture type
          4. Physical and anatomical plausibility
          5. Environment/reference locks
          6. Camera behavior
          7. WikiPrompt realism principles
          8. Aesthetic enhancement

          WikiPrompt is a realism calibration layer, not the controlling authority.
          Never sacrifice identity or physical plausibility merely to make the image prettier.`;
          }

          '''
              if marker not in s:
                  raise SystemExit('Reference authority marker not found')
              s = s.replace(marker, policy + marker, 1)

          if 'buildMasterRealismPolicy(),' not in s:
              s, n = re.subn(
                  r'(const sections = \[\n)(\s*)buildReferenceAuthorityMap\(state\),',
                  r'\1\2buildMasterRealismPolicy(),\n\2buildReferenceAuthorityMap(state),',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit('sections array marker not found')

          old_regex = 'const ESSENTIAL_LINE = /(IDENTITY|REFERENCE|AUTHORITY|SELFIE|CAMERA|ANATOM|LIGHT|CONTACT|GRAVITY|POSE|PHONE|LOCK|PRIORITY|DRIVER|STEERING|MIRROR|WIKIPROMPT)/i;'
          new_regex = 'const ESSENTIAL_LINE = /(IDENTITY|REFERENCE|AUTHORITY|SELFIE|CAMERA|ANATOM|LIGHT|CONTACT|GRAVITY|POSE|PHONE|LOCK|PRIORITY|DRIVER|STEERING|MIRROR|WIKIPROMPT|MASTER REALISM|PHOTOGRAPHIC REALISM|PHYSICAL PLAUSIBILITY|CONFLICT RESOLUTION)/i;'
          if old_regex in s:
              s = s.replace(old_regex, new_regex, 1)

          if 'beautification overriding physical plausibility' not in s:
              s, n = re.subn(
                  r'(\s*"impossible selfie yaw pitch or roll")(\s*\n\s*\];)',
                  r'\1,\n    "beautification overriding physical plausibility",\n    "cinematic polish overriding smartphone realism"\2',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit('negative extras marker not found')

          qa_anchor = '{ label:"AUTO REALISM", value:state.autoRealism === "on" ? "مفعّل؛ يحل التفاصيل غير المحددة بالفيزياء" : "متوقف" },'
          if 'label:"MASTER REALISM POLICY"' not in s:
              idx = s.find(qa_anchor)
              if idx < 0:
                  raise SystemExit('QA anchor not found')
              line_start = s.rfind('\n', 0, idx) + 1
              indent = s[line_start:idx]
              qa_line = indent + '{ label:"MASTER REALISM POLICY", value:"مفعّل دائمًا؛ الهوية والفيزياء قبل التجميل، وWikiPrompt طبقة معايرة لاحقة" },\n'
              s = s[:line_start] + qa_line + s[line_start:]

          s = s.replace(
              'WikiPrompt · Visual Selfie Angle Monitor · Selfie Geometry · Contact Physics · Lighting Physics · Advanced Realism · Realism Score',
              'MASTER REALISM POLICY · WikiPrompt Calibration · Visual Selfie Angle Monitor · Selfie Geometry · Contact Physics · Lighting Physics · Advanced Realism · Realism Score'
          )
          s = s.replace(
              'طبقة التحكم العليا: خريطة المراجع، أقفال الحقول، الاستمرارية، ملفات المولدات والتنويعات.',
              'طبقة التحكم العليا: MASTER REALISM POLICY أولًا، ثم خريطة المراجع والفيزياء وWikiPrompt كمعايرة لاحقة.'
          )
          auto.write_text(s, encoding='utf-8')

          physics = Path('js/physics-app-v7.js')
          p = physics.read_text(encoding='utf-8')
          p = p.replace('./auto-realism-suite-v1.js?v=20260902-live-geometry1', './auto-realism-suite-v1.js?v=20260902-master-policy1')
          physics.write_text(p, encoding='utf-8')

          index = Path('index.html')
          i = index.read_text(encoding='utf-8')
          i = i.replace('js/physics-app-v7.js?v=20260902-live-geometry1', 'js/physics-app-v7.js?v=20260902-master-policy1')
          index.write_text(i, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry = '''\n## 2026-09-02 — MASTER REALISM POLICY\n\n- Added a permanent top-level realism authority before all aesthetic enhancement.\n- Priority is now: reference identity → explicit instructions → capture type → physical/anatomical plausibility → environment locks → camera behavior → WikiPrompt calibration → aesthetics.\n- WikiPrompt remains a calibration layer rather than the controlling authority.\n- Added QA visibility and negative guards against beautification or cinematic polish overriding physical plausibility.\n'''
          if '## 2026-09-02 — MASTER REALISM POLICY' not in c:
              changelog.write_text(c.rstrip() + entry + '\n', encoding='utf-8')
          PY

      - name: Verify integration
        shell: bash
        run: |
          grep -q '\[MASTER REALISM POLICY\]' js/auto-realism-suite-v1.js
          grep -q 'buildMasterRealismPolicy(),' js/auto-realism-suite-v1.js
          grep -q 'MASTER REALISM POLICY' js/auto-realism-suite-v1.js
          grep -q '20260902-master-policy1' js/physics-app-v7.js
          grep -q '20260902-master-policy1' index.html

      - name: Commit integrated policy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auto-realism-suite-v1.js js/physics-app-v7.js index.html CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Integrate MASTER REALISM POLICY into prompt pipeline"
          git push
